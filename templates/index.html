{% load static %}

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Widget — Django Ready</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
{% csrf_token %}
<!-- ============ LAUNCHER ============ -->
<button class="cb-launcher" id="cbLauncher" aria-label="Chat kholein">
  <span class="cb-dot"></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
</button>

<!-- ============ CHAT WINDOW ============ -->
<div class="cb-window" id="cbWindow">
  <div class="cb-header">
    <div class="cb-avatar">🧑&zwj;💼</div>
    <div class="cb-header-text">
      <h3>PAI</h3>
      <p><span class="cb-status-dot"></span> Online</p>
    </div>
    <button class="cb-close" id="cbClose" aria-label="Chat band karein">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="cb-messages" id="cbMessages">
    <div class="cb-row bot">
      <div class="cb-mini-avatar">🧑&zwj;💼</div>
      <div>
        <div class="cb-bubble">Namaste! How can I help you?</div>
        <div class="cb-time">Abhi</div>
      </div>
    </div>
  </div>



  <!-- ============ QUICK QUESTIONS (YE NAYA DIV ADD KIYA GAYA HAI) ============ -->
  <div class="cb-quick" id="cbQuick"></div>

  <div class="cb-inputbar">
    <input type="text" id="cbInput" placeholder="Type Your query" autocomplete="off">
    <button class="cb-send" id="cbSend" aria-label="Bhejein">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="cb-footer-note">Powered by Prakhar Software Solution</div>
</div>

<script src="{% static 'js/script.js' %}" defer></script>
</body>
</html>
